# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# mostly from https://github.com/microsoft/torchgeo/blob/main/.github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      # torchvision pins torch, must update in unison
      torch:
        patterns:
          - "torch"
          - "torchvision"
    ignore:
      # setuptools releases new versions almost daily
      - dependency-name: "setuptools"
        update-types: ["version-update:semver-patch"]
      # segmentation-models-pytorch pins timm, must update in unison
      - dependency-name: "timm"
  # The demo webapps are separate pnpm projects. Group their updates so a
  # toolchain bump arrives as one PR instead of one per transitive package.
  - package-ecosystem: "npm"
    directory: "/examples/webapps/prithvi.tiny.onnx.demo"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      webapp-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/examples/webapps/terramind.tiny.onnx.demo"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      webapp-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
