name: Static Code Analysis (Pylint)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  torch-load-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check torch.load uses weights_only=True
      run: |
        python3 - <<'EOF'
        import ast, subprocess, sys

        bad = []
        for path in subprocess.check_output(["git", "ls-files", "*.py"], text=True).split():
            for node in ast.walk(ast.parse(open(path).read(), path)):
                if (
                    isinstance(node, ast.Call)
                    and isinstance(node.func, ast.Attribute)
                    and isinstance(node.func.value, ast.Name)
                    and node.func.value.id == "torch"
                    and node.func.attr == "load"
                    and not any(
                        kw.arg == "weights_only"
                        and isinstance(kw.value, ast.Constant)
                        and kw.value.value is True
                        for kw in node.keywords
                    )
                ):
                    bad.append(f"{path}:{node.lineno}")

        if bad:
            print("torch.load() without weights_only=True:\n" + "\n".join(bad))
            sys.exit(1)
        EOF
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11","3.12","3.13"]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')  --output=lintpy.txt || true
        pylint $(git ls-files '*.ipynb')  --output=lintipynb.txt || true
        echo "Linting for Python files."
        cat lintpy.txt
        echo "Linting for Jupyter files."
        cat lintipynb.txt
